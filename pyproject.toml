[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radshield"
version = "0.1.0"
description = "Radiation shielding calculations for medical imaging facilities (NCRP 147, TG-108)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
dev = ["pytest>=8.0", "httpx>=0.27", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radshield = ["physics/data/*.csv", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
